<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 💗</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background: linear-gradient(135deg, #ffd6e7, #fff0f6);
  color: #5c2942;
}

.page {
  display: none;
  width: 100%;
  height: 100vh;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 25px;
  text-align: center;
}

.page.active {
  display: flex;
  animation: fade .8s ease;
}

.card {
  width: min(500px, 95%);
  padding: 35px 25px;
  border-radius: 30px;
  background: rgba(255,255,255,.75);
  backdrop-filter: blur(12px);
  box-shadow: 0 15px 50px rgba(150,50,90,.2);
}

h1 {
  font-size: 42px;
  margin-bottom: 15px;
}

.script {
  font-family: cursive;
}

.sub {
  line-height: 1.7;
  margin-bottom: 25px;
}

.btn {
  border: 0;
  padding: 14px 25px;
  border-radius: 30px;
  background: #ff6fa3;
  color: white;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(255,90,145,.3);
}

.btn:hover {
  transform: scale(1.05);
}

.back {
  position: absolute;
  top: 20px;
  left: 20px;
  border: 0;
  background: rgba(255,255,255,.7);
  padding: 10px 15px;
  border-radius: 20px;
  color: #8b3d5e;
}

.photo {
  width: 100%;
  max-height: 350px;
  object-fit: cover;
  border-radius: 25px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.15);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
}

.gallery img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 18px;
}

.envelope {
  font-size: 100px;
  cursor: pointer;
  animation: pulse 1.5s infinite;
}

.heart {
  position: fixed;
  bottom: -30px;
  font-size: 22px;
  animation: float 6s linear infinite;
  opacity: .7;
  pointer-events: none;
}

.player {
  margin: 20px 0;
}

audio {
  width: 100%;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse {
  50% {
    transform: scale(1.15);
  }
}

@keyframes float {
  from {
    transform: translateY(0) rotate(0);
    opacity: 0;
  }
  20% {
    opacity: .8;
  }
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

@media(max-width:500px) {
  h1 {
    font-size: 34px;
  }

  .gallery img {
    height: 140px;
  }
}
</style>
</head>

<body>

<!-- HALAMAN 1 -->
<section class="page active" id="p1">
  <div class="card">
    <div style="font-size:70px">🎂</div>

    <h1 class="script">
      Happy Birthday 💗
    </h1>

    <p class="sub">
      Ada sesuatu yang spesial untuk kamu...
      <br>
      Jangan langsung ditutup ya 🥺
    </p>

    <button class="btn" onclick="go(2)">
      Buka Surprise 💌
    </button>
  </div>
</section>


<!-- HALAMAN 2 -->
<section class="page" id="p2">
  <div class="card">

    <h1 class="script">
      For You 🌷
    </h1>

    <p class="sub">
      Hari ini adalah hari spesial seseorang
      yang sangat berarti.
    </p>

    <button class="btn" onclick="go(3)">
      Lihat Foto 📸
    </button>

  </div>
</section>


<!-- HALAMAN 3 -->
<section class="page" id="p3">
  <button class="back" onclick="go(2)">← Kembali</button>

  <div class="card">

    <h1 class="script">
      Our Memories 📸
    </h1>

    <div class="gallery">

      <!-- GANTI FOTO DI SINI -->
      <img src="https://images.unsplash.com/photo
